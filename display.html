<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ច្រកទ្វាររោងចក្រ - Dynamic QR Code</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- បណ្ណាល័យបង្កើត QR Code និង SHA-256 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white text-gray-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-md w-full border-4 border-indigo-500">
    <div class="flex items-center gap-2 mb-2">
      <span class="w-3 h-3 bg-green-500 rounded-full animate-ping"></span>
      <h1 class="text-2xl font-bold text-gray-800 tracking-wide">ច្រកទ្វារទី ១ (GATE 1)</h1>
    </div>
    <p class="text-sm text-gray-500 mb-6 font-medium">សូមស្កេនដើម្បីកត់ត្រាវត្តមានចូល/ចេញ</p>

    <!-- កន្លែងបង្ហាញ QR Code -->
    <div id="qrcode" class="p-4 bg-gray-50 rounded-2xl border-2 border-gray-200"></div>

    <!-- របារពេលវេលា ១៥ វិនាទី -->
    <div class="w-full mt-6">
      <div class="flex justify-between text-xs text-gray-500 mb-1 font-semibold">
        <span>ប្តូរកូដថ្មីក្នុងរយៈពេល</span>
        <span id="countdown">15s</span>
      </div>
      <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
        <div id="progress" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-1000 ease-linear" style="width: 100%;"></div>
      </div>
    </div>

    <div class="mt-4 text-center text-xs text-gray-400">
      *កូដ QR ផ្លាស់ប្តូរស្វ័យប្រវត្ត ដើម្បីទប់ស្កាត់ការថតរូបផ្ញើបន្លំ
    </div>
  </div>

  <script>
    const SECRET_KEY = "FACTORY_SECRET_2026";
    let qrcode = new QRCode(document.getElementById("qrcode"), {
      width: 250,
      height: 250,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });

    function generateDynamicQR() {
      const now = Date.now();
      const slot = Math.floor(now / 15000);
      const signature = CryptoJS.SHA256("GATE1|" + slot + "|" + SECRET_KEY).toString().substring(0, 12);
      const qrData = "GATE1|" + slot + "|" + signature;
      
      qrcode.clear();
      qrcode.makeCode(qrData);

      const remainingSec = 15 - (Math.floor(now / 1000) % 15);
      document.getElementById("countdown").innerText = remainingSec + "s";
      document.getElementById("progress").style.width = ((remainingSec / 15) * 100) + "%";
    }

    generateDynamicQR();
    setInterval(generateDynamicQR, 1000);
  </script>
</body>
</html>
