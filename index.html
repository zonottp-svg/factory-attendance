<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ស្កេនវត្តមានបុគ្គលិក</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- បណ្ណាល័យស្កេន QR តាម Camera ទូរស័ព្ទ -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans">

  <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
    <div class="text-center mb-5">
      <h1 class="text-2xl font-bold text-gray-800">ស្កេនវត្តមានរោងចក្រ</h1>
      <p class="text-xs text-gray-500 mt-1">សូមបំពេញព័ត៌មាន និងបើកកាមេរ៉ាស្កេន</p>
    </div>

    <!-- ប្រអប់ព័ត៌មានបុគ្គលិក (វាយតែម្តង វានឹង Save ជាប់ទូរស័ព្ទរហូត) -->
    <div class="space-y-3 mb-5">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">អត្តលេខកម្មករ (Worker ID)</label>
        <input type="text" id="workerId" placeholder="ឧ. W001" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none uppercase font-bold text-gray-700">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">លេខសម្ងាត់ PIN (៤ ខ្ទង់)</label>
        <input type="password" id="pin" placeholder="****" maxlength="6" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-gray-700">
      </div>

      <!-- ជ្រើសរើស ចូល ឬ ចេញ -->
      <div class="flex gap-3 pt-1">
        <label class="flex-1 text-center py-2 border-2 border-green-500 rounded-xl cursor-pointer has-[:checked]:bg-green-500 has-[:checked]:text-white font-bold text-green-700 transition">
          <input type="radio" name="scanType" value="IN" checked class="hidden"> ស្កេនចូល (IN)
        </label>
        <label class="flex-1 text-center py-2 border-2 border-amber-500 rounded-xl cursor-pointer has-[:checked]:bg-amber-500 has-[:checked]:text-white font-bold text-amber-700 transition">
          <input type="radio" name="scanType" value="OUT" class="hidden"> ស្កេនចេញ (OUT)
        </label>
      </div>
    </div>

    <!-- ប៊ូតុងបើកកាមេរ៉ា -->
    <button id="btnStart" onclick="startScanner()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition flex justify-center items-center gap-2 mb-4">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
      បើកកាមេរ៉ាស្កេន
    </button>

    <!-- កន្លែងបង្ហាញកាមេរ៉ាស្កេន -->
    <div id="reader-container" class="hidden overflow-hidden rounded-xl border border-gray-300">
      <div id="reader" style="width: 100%;"></div>
    </div>

    <!-- សារជូនដំណឹងលទ្ធផល -->
    <div id="resultMessage" class="hidden mt-4 p-4 rounded-xl text-center text-sm font-semibold"></div>
  </div>

  <script>
    // ⚠️ ដាក់ Web App URL របស់អ្នកត្រង់នេះ ⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoWy_32_NWzoqkl7N7XVryhH3N8P9-WZCETTMz-ulfqx8JZ-tSDe3Que3eAlfPmeTW/exec";

    // បង្កើត ឬទាញយក Device ID តែមួយគត់សម្រាប់ទូរស័ព្ទនេះ
    let deviceId = localStorage.getItem("factory_device_id");
    if (!deviceId) {
      deviceId = "DEV-" + Math.random().toString(36).substring(2, 9) + "-" + Date.now();
      localStorage.setItem("factory_device_id", deviceId);
    }

    // ចងចាំ Worker ID & PIN លើទូរស័ព្ទ
    document.getElementById("workerId").value = localStorage.getItem("factory_worker_id") || "";
    document.getElementById("pin").value = localStorage.getItem("factory_pin") || "";

    let html5QrCode = null;
    let isProcessing = false;

    function showStatus(msg, isSuccess) {
      const box = document.getElementById("resultMessage");
      box.classList.remove("hidden", "bg-green-100", "text-green-700", "border-green-400", "bg-red-100", "text-red-700", "border-red-400");
      if (isSuccess) {
        box.classList.add("bg-green-100", "text-green-700", "border", "border-green-400");
      } else {
        box.classList.add("bg-red-100", "text-red-700", "border", "border-red-400");
      }
      box.innerText = msg;
    }

    function startScanner() {
      const wId = document.getElementById("workerId").value.trim();
      const pin = document.getElementById("pin").value.trim();
      if (!wId || !pin) {
        alert("សូមវាយបញ្ចូលអត្តលេខ និង PIN ជាមុនសិន!");
        return;
      }
      localStorage.setItem("factory_worker_id", wId);
      localStorage.setItem("factory_pin", pin);

      document.getElementById("btnStart").classList.add("hidden");
      document.getElementById("reader-container").classList.remove("hidden");

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch(err => {
        alert("មិនអាចបើកកាមេរ៉ាបានទេ: " + err);
        document.getElementById("btnStart").classList.remove("hidden");
        document.getElementById("reader-container").classList.add("hidden");
      });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // បិទកាមេរ៉ាពេលស្កេនបាន
      html5QrCode.stop().then(() => {
        document.getElementById("reader-container").classList.add("hidden");
        document.getElementById("btnStart").classList.remove("hidden");
      });

      showStatus("កំពុងផ្ទៀងផ្ទាត់ និងកត់ត្រាវត្តមាន...", true);

      // ទាញទីតាំង GPS (បើមាន)
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => submitAttendance(decodedText, pos.coords.latitude, pos.coords.longitude),
          () => submitAttendance(decodedText, null, null),
          { timeout: 7000 }
        );
      } else {
        submitAttendance(decodedText, null, null);
      }
    }

    function submitAttendance(qrText, lat, lng) {
      const payload = {
        workerId: document.getElementById("workerId").value.trim(),
        pin: document.getElementById("pin").value.trim(),
        scanType: document.querySelector('input[name="scanType"]:checked').value,
        deviceId: deviceId,
        qrText: qrText,
        lat: lat,
        lng: lng
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        isProcessing = false;
        showStatus(data.message, data.success);
      })
      .catch(err => {
        isProcessing = false;
        showStatus("មានបញ្ហាភ្ជាប់ទៅប្រព័ន្ធ: " + err.message, false);
      });
    }
  </script>
</body>
</html>
